<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plume</title>
<style>
  /* Écran de Plume : au lancement (avant Discord) et pendant une mise à jour.
     Plume met à jour le texte et la barre par window.plumeSplash. */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, rgb(139 124 246 / .16), transparent 70%),
      #0e0c16;
    color: #ece9ff; font: 15px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    /* La fenêtre n'a pas de cadre : on peut la déplacer depuis l'écran. */
    -webkit-app-region: drag; app-region: drag;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 22px; animation: in .5s ease-out both; }
  .logo { position: relative; width: 132px; height: 132px; }
  /* Halo qui respire derrière le logo. */
  .logo::before {
    content: ""; position: absolute; inset: -34px; border-radius: 50%;
    background: radial-gradient(circle, rgb(139 124 246 / .45), transparent 65%);
    animation: breathe 2.4s ease-in-out infinite;
  }
  .tile {
    position: absolute; inset: 0; border-radius: 30px;
    background: linear-gradient(135deg, #8b7cf6, #4c3fb8);
    box-shadow: 0 14px 40px rgb(76 63 184 / .55), inset 0 1px 0 rgb(255 255 255 / .18);
    display: grid; place-items: center; overflow: hidden;
  }
  /* Reflet qui passe sur la tuile. */
  .tile::after {
    content: ""; position: absolute; inset: -40%;
    background: linear-gradient(115deg, transparent 40%, rgb(255 255 255 / .22) 50%, transparent 60%);
    animation: shine 2.8s ease-in-out infinite;
  }
  /* La plume flotte et se balance, comme portée par l'air. */
  .feather { width: 84px; height: 84px; transform-origin: 30% 85%; animation: float 3.2s ease-in-out infinite; }
  h1 { margin: 0; font: 650 26px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: .02em; }
  #status { min-height: 20px; color: #b9b2e6; font-size: 14px; text-align: center; transition: opacity .2s; }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  .bar { width: 240px; height: 6px; border-radius: 99px; background: rgb(139 124 246 / .18); overflow: hidden; }
  .bar[hidden] { display: none; }
  .bar span { display: block; height: 100%; width: 0; border-radius: inherit;
    background: linear-gradient(90deg, #8b7cf6, #c4b8ff); transition: width .25s ease; }
  /* Barre sans pourcentage connu : un segment qui va et vient. */
  .bar.busy span { width: 35%; animation: busy 1.2s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(4px) rotate(-6deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes shine { 0% { transform: translateX(-60%); } 60%, 100% { transform: translateX(60%); } }
  @keyframes busy { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="logo">
    <div class="tile">
      <svg class="feather" viewBox="0 0 1024 1024" aria-hidden="true">
        <path d="M742 236c-148 18-286 112-354 260-38 82-54 170-56 256l-60 92 34 22 58-88c84-6 170-30 244-80 140-94 196-272 134-462z" fill="#fff"/>
        <path d="M700 300 392 752" stroke="#6b5ce0" stroke-width="28" stroke-linecap="round"/>
        <path d="M612 396l-92 2M560 470l-96 6M508 548l-92 12M458 624l-70 14" stroke="#6b5ce0" stroke-width="16" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <h1>Plume</h1>
  <div id="status"><span class="dots">Démarrage</span></div>
  <div class="bar busy" id="bar" hidden><span></span></div>
</div>
<script>
  const statusEl = document.getElementById("status");
  const bar = document.getElementById("bar");
  window.plumeSplash = {
    // Texte de l'étape en cours ; les points de suspension s'animent.
    status(text, animated = true) {
      statusEl.innerHTML = "";
      const s = document.createElement("span");
      s.textContent = text;
      if (animated) s.className = "dots";
      statusEl.appendChild(s);
    },
    // Progression de 0 à 1 ; null = en cours sans pourcentage ; undefined = barre cachée.
    progress(p) {
      bar.hidden = p === undefined;
      bar.classList.toggle("busy", p === null);
      bar.firstElementChild.style.width = p == null ? "" : `${Math.round(Math.max(0, Math.min(1, p)) * 100)}%`;
    },
  };
  // Mise à jour : Plume ouvre cet écran avec ?update=<version>.
  const update = new URLSearchParams(location.search).get("update");
  if (update) { plumeSplash.status(`Mise à jour vers Plume ${update}`); plumeSplash.progress(null); }
</script>
</body>
</html>
