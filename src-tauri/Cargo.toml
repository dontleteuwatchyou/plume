[package]
name = "plume"
version = "0.5.0"
description = "Discord, en léger : discord.com/app dans Tauri, avec Nightcord et la stéréo micro"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sans wry par défaut : sous Linux le moteur est CEF (src/rt.rs).
tauri = { version = "2.12", default-features = false, features = ["tray-icon", "compression", "dynamic-acl", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2.12", features = ["wry", "common-controls-v6"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Chromium embarqué (src/rt.rs). Fourche de Dorion du runtime CEF de Tauri,
# figée sur un commit : l'officiel n'est pas encore publié.
tauri-runtime-cef = { git = "https://github.com/SpikeHD/tauri-runtime-cef.git", rev = "3be79e3" }
# Même version que tauri-runtime-cef (son glisser-déposer).
winit = "=0.31.0-beta.2"

[target.'cfg(not(windows))'.dependencies]
# Disposition du clavier pour le push-to-talk (ptt.rs), mêmes versions que Tauri.
gtk = "0.18"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Pour #[implement] (rappel COM de la capture audio, loopback.rs).
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
